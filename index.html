    const blob=await (await fetch(src)).blob();
    const total=blob.size;
    let durSec=pl.duration; if(!isFinite(durSec) || !(durSec>0)) durSec=await secBefore(blob,total);
    if(!(durSec>0)) throw new Error(t('onlineOnlyMp3'));

    // ---- audio window: from a little before ayah `from` to a bit after ayah `to`+1 ----
    const lensAll=currentSurahAyahs.map(ay=>normAr(String(ay.text||'')).length||1);
    const sum=(x,y)=>{ let q=0; for(let k=x;k<=y;k++) q+=lensAll[k-1]; return q; };
    const refEnd=final?N:to+1;
    let b0=0, secStart=0;
    if(from>1){
      let target=Math.max(0,fromSec-3);
      for(let tries=0;tries<4;tries++){
        b0=await T.findSync(blob,Math.max(0,Math.floor(target/durSec*total)));
        secStart=await secBefore(blob,b0);
        if(secStart<=fromSec-0.5) break;
        target=Math.max(0,target-(secStart-fromSec)-3);
      }
    }
    let b1=total;
    if(!final){
      const frac=sum(from,refEnd)/sum(from,N);
      const s1=Math.min(durSec, fromSec+(durSec-fromSec)*frac*1.3+10);
      b1=await T.findSync(blob,Math.floor(s1/durSec*total));
      if(b1>=total*0.995 || b1<=b0+50000) b1=total;
    }

    // ---- 0) estimate the audio time that will be sent; wait if the free hourly limit would be passed ----
    const isGroq=(prov()==='whisper') && /^gsk_/.test(key);
    const estSec=durSec*(b1-b0)/total;
    if(isGroq){
      // daily limit: nothing is sent when this part would pass the 480 minutes
      const dayArr=usageLoadDay(), usedDaySec=dayArr.reduce((q,x)=>q+x[1],0);
      if(usedDaySec+estSec>LIMIT_DAY_SEC){
        const need=usedDaySec+estSec-LIMIT_DAY_SEC; let acc=0, until=Date.now();
        for(const x of dayArr){ acc+=x[1]; until=x[0]+86400000; if(acc>=need) break; }
        const mins=Math.max(1,Math.ceil((until-Date.now())/60000));
        const dmsg=tf('dayLimitHit',{lim:480,used:Math.round(usedDaySec/60),need:Math.round(estSec/60),wait:fmtWait(mins)});
        try{ window.__updateGroqLeft(); }catch(_){}
        say(dmsg);
        try{ window.appAlert(dmsg); }catch(_){}
        return {final:true,aborted:true,dayLimit:true};
      }
      await waitBudget(estSec);
      const used=usageLoad().reduce((q,x)=>q+x[1],0);
      say(tf('onlineRange',{a:from,b:to})+'\n'+tf('onlineEst',{m:Math.round(estSec/6)/10,h:Math.round(used/6)/10}),true);
      await new Promise(r2=>setTimeout(r2,1200));
    }

    // ---- 1) send this window to Whisper in frame-aligned pieces (< 25 MB each) ----
    const CH=18*1024*1024, pieces=[]; let a=b0;
    while(a<b1){ let b=Math.min(b1,a+CH); if(b<b1) b=await T.findSync(blob,b); if(b<=a) b=Math.min(b1,a+CH); pieces.push([a,b]); a=b; }
    let offset=secStart; const hyp=[];
    for(let i=0;i<pieces.length;i++){
      if(cancelled) throw new Error('cancelled');
      say(tf('onlineRange',{a:from,b:to})+'  ('+tf('onlineUpload',{i:i+1,n:pieces.length})+')',true);
      const bytes=new Uint8Array(await blob.slice(pieces[i][0],pieces[i][1]).arrayBuffer());
      const dur=mp3Seconds(bytes,(b0===0 && i===0));
      if(!dur) throw new Error(t('onlineOnlyMp3'));
      const js=await transcribe(key,bytes,i+1);
      if(isGroq){ usageAdd(dur); window.__updateGroqLeft(); }
      const words=js.words||[];
      if(!words.length && i===0) throw new Error('Whisper returned no word timestamps');
      words.forEach(w=>{
        const n=normAr(w.word); if(!n) return;
        const st=(w.start||0)+offset-fromSec, en=(w.end||0)+offset-fromSec;
        if(st>=-0.8) hyp.push({n, start:st, end:en});      // times are relative to the start of ayah `from`
      });
      offset+=dur;
    }

    // ---- 2) match the Whisper words with the Quran text of these ayahs ----
    say(t('onlineAlign'),true);
    await new Promise(r2=>setTimeout(r2,30));
    const ayahWords=currentSurahAyahs.slice(from-1,refEnd).map(ay=>String(ay.text||'').split(/\s+/).map(normAr).filter(Boolean));
    const lens=ayahWords.map(w=>w.join('').length||1);
    const m=ayahWords.length;
    const res=ayahStartsFromWords(ayahWords,hyp);
    if(res.matched < Math.max(1,Math.floor(m*0.4))) throw new Error('only '+res.matched+' of '+m+' ayahs recognised');
    let lastOk=-1; for(let k=m-1;k>=0;k--){ if(res.starts[k]!==null){ lastOk=k; break; } }
    const commit = final ? m-1 : lastOk;       // index of the last mark we write
    if(!final && commit<1) throw new Error(t('onlineNoProg'));
    const endsOk=res.ends.filter(x=>x!==null);
    const lastEnd=Math.max.apply(null,endsOk);
    const rel = final ? fillAndOrder(res.starts,lens,lastEnd)
                      : fillAndOrder(res.starts.slice(0,commit+1),lens.slice(0,commit+1),res.ends[commit]!==null?res.ends[commit]:lastEnd);
    let starts=rel.map(x=>x+fromSec);          // absolute seconds
    starts[0]=fromSec;
    let endSec=Math.min(durSec,lastEnd+fromSec+0.25);

    // ---- 3) snap every boundary to the real silence in the audio (decode only this window) ----
    try{
      const r=await T.decodeEnvelope(blob.slice(b0,b1), p=>say(tf('onlineSnap',{p:Math.round(p*100)}),true), ()=>cancelled);
      const sl=silenceList(r.env,r.frameSec,0.10).map(c=>({t:c.t+secStart,s:c.s+secStart,dur:c.dur}));
      starts=snapStarts(starts,sl,0.7);
      if(final){
        const F=r.env.length, sorted=Float32Array.from(r.env).sort();
        const q=pp=>sorted[Math.min(F-1,Math.floor(pp*(F-1)))], thr=q(0.10)+0.30*(q(0.92)-q(0.10));
        let last=F-1; while(last>0 && r.env[last]<thr) last--;
        endSec=Math.min(durSec,secStart+(last+1)*r.frameSec+0.3);
      }
    }catch(snapErr){ if(cancelled || (snapErr&&snapErr.message==='cancelled')) throw snapErr; /* keep the Whisper times */ }
    starts[0]=fromSec;
    for(let i=1;i<starts.length;i++) if(!(starts[i]>starts[i-1]+0.15)) starts[i]=starts[i-1]+0.15;
    if(final && !(endSec>starts[starts.length-1]+0.1)) endSec=starts[starts.length-1]+0.5;

    // ---- 4) write the marks: keep the earlier ayahs, replace from `from` onwards ----
    const backup={sura:currentMarksSura(), marks:JSON.parse(JSON.stringify(marks)), seq:seqCounter, a:from, b:(final?N:from+commit-1)};
    if(from===1){ marks=[]; seqCounter=0; }
    else marks=marks.filter(mk=>!mk.isTotal && Number(mk.ayah)<from);
    starts.forEach((st,k)=>{
      const mk={ayah:from+k, timeMs:(from+k===1)?0:Math.round(st*1000), isTotal:false, seq:seqCounter++};
      marks.push(mk);
    });
    if(final) marks.push({ayah:999, timeMs:Math.round(endSec*1000), isTotal:true, seq:seqCounter++});
    render();
    undoSave(backup); window.__updateUndoBtn();
    let msg;
    if(final) msg=tf('onlineFinished',{n:N});
    else { const nextFrom=from+commit; msg=tf('onlinePart',{a:from,b:nextFrom-1,n:N,c:nextFrom}); }
    try{ if(isGroq && window.__groqRemain){ const rm=window.__groqRemain(); msg+='\n'+tf('groqAfterL',{h:rm.hour,d:rm.day}); } }catch(_){}
    say(msg, auto && !final);
    return {final:final};
  }

  btn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    if(running || window.__ayahBusy) return;
    const pl=document.getElementById('player'), src=pl && (pl.currentSrc||pl.src);
    const key=keyInp.value.trim();
    if(!src){ appAlert(t('autoMarkNoAudio')); return; }
    if(!currentSurahAyahs || !currentSurahAyahs.length){ appAlert(t('autoMarkNoText')); return; }
    if(!key){ appAlert(t('onlineNoKey')); return; }
    try{ localStorage.setItem(KEY_SLOT[prov()], key); localStorage.setItem('stt_provider', prov()); }catch(_){}
    try{ document.getElementById('settingsMenu').classList.remove('open'); document.querySelector('header').classList.remove('menu-open'); }catch(_){}
    running=true; window.__ayahBusy=true; cancelled=false;
    try{
      const auto=!!(autoCb && autoCb.checked);
      let first=true, guard=0;
      for(;;){
        const r=await runOnce(first,key,auto);
        first=false;
        if(r.final || !auto || cancelled || ++guard>200) break;
        await new Promise(r2=>setTimeout(r2,400));
      }
    }catch(err){
      if(err && err.dayLimit){ say(err.message); try{ window.appAlert(err.message); }catch(_){} }
      else if(cancelled || (err&&err.message==='cancelled')) say(t('autoMarkCancelled'));
      else say(t('onlineFail')+(err&&err.message?err.message:err));
    }finally{ running=false; window.__ayahBusy=false; }
  });
})();

// ---- Back button (Android): while the menu is open it closes the menu and shows the main screen instead of leaving the app ----
(function(){
  const menu=document.getElementById('settingsMenu'), hdr=document.querySelector('header');
  if(!menu||!hdr) return;
  let pushed=false, ignorePop=0;
  const isOpen=()=>menu.classList.contains('open') || hdr.classList.contains('menu-open');
  const closeMenu=()=>{ menu.classList.remove('open'); hdr.classList.remove('menu-open'); };
  new MutationObserver(()=>{
    if(menu.classList.contains('open')){
      if(!pushed){ try{ history.pushState({idrisMenu:true},''); pushed=true; }catch(_){} }
    }else if(pushed){
      pushed=false;                                   // closed by a button: drop our history entry quietly
      if(history.state && history.state.idrisMenu){ ignorePop++; try{ history.back(); }catch(_){ ignorePop--; } }
    }
  }).observe(menu,{attributes:true,attributeFilter:['class']});
  window.addEventListener('popstate',()=>{
    if(ignorePop>0){ ignorePop--; return; }
    if(isOpen()){ pushed=false; closeMenu(); }        // the Back button was pressed
  });

  // One entry point for the native Back button: returns true when it closed something (menu / list), false when the app may exit.
  window.__idrisBack=function(){
    try{
      const ov=document.getElementById('langPickOverlay');
      if(ov && !ov.classList.contains('hide')) return true;                       // language screen: Back does nothing
      const pop=document.querySelectorAll('#pickList.open, #miniSpeedList.open');
      if(pop.length){ pop.forEach(p=>p.classList.remove('open')); return true; }
      if(isOpen()){ closeMenu(); return true; }
    }catch(_){}
    return false;
  };
  // Capacitor @capacitor/app plugin (when it is installed in the APK): handle Back ourselves
  try{
    const AppPl=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if(AppPl && typeof AppPl.addListener==='function'){
      AppPl.addListener('backButton',()=>{ if(!window.__idrisBack()){ try{ if(AppPl.exitApp) AppPl.exitApp(); }catch(_){} } });
    }
  }catch(_){}
})();

// ================= Audio files stay inside the app (IndexedDB) =================
(function(){
  Object.assign(TRANSLATIONS.ku, {"audioClear": "سڕینەوەی دەنگە هەڵگیراوەکان لە ناو ئەپەکە", "audioClearAsk": "دڵنیایت لە سڕینەوەی دەنگەکان لە ناو ئەپەکەدا؟\n(تەنها لە ناو ئەپەکە دەسڕدرێنەوە، نەک لە زاکیرەی مۆبایلەکەت)", "dlgYes": "بەڵێ", });
  Object.assign(TRANSLATIONS.en, {"audioClear": "Delete audio saved inside the app", "audioClearAsk": "Delete the audio from inside the app?\n(Only the copy inside the app is deleted, not the files in your phone storage.)", "dlgYes": "Yes", });
  Object.assign(TRANSLATIONS.ar, {"audioClear": "حذف الصوتيات المحفوظة داخل التطبيق", "audioClearAsk": "هل أنت متأكد من حذف الصوتيات من داخل التطبيق؟\n(يُحذف ما داخل التطبيق فقط، وليس من ذاكرة هاتفك)", "dlgYes": "نعم", });
  Object.assign(TRANSLATIONS.ku, {"audioSavedCount":"{n} سورەت هەڵگیراوە","audioSavedNone":"هیچ سورەتێک هەڵنەگیراوە"});
  Object.assign(TRANSLATIONS.en, {"audioSavedCount":"{n} surahs saved","audioSavedNone":"No surah saved"});
  Object.assign(TRANSLATIONS.ar, {"audioSavedCount":"{n} سورة محفوظة","audioSavedNone":"لا توجد سور محفوظة"});
  const DB_NAME='ayahMarkerAudio', STORE='files';
  // Open the database WITHOUT asking for a version, so a database that already exists with a higher
  // version (for example made by another build) opens normally. The 'files' store (keyPath 'sura') is
  // created when it is missing; if a store with that name exists with another layout, a second
  // database name is used instead.
  const DB_NAMES=[DB_NAME, DB_NAME+'_sura'];
  function openNamed(name){
    return new Promise((res,rej)=>{
      const r=indexedDB.open(name);
      r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE,{keyPath:'sura'}); };
      r.onerror=()=>rej(r.error||new Error('open failed'));
      r.onblocked=()=>rej(new Error('database blocked'));
      r.onsuccess=()=>{
        const db=r.result;
        if(db.objectStoreNames.contains(STORE)){
          let ok=false;
          try{ ok = db.transaction(STORE,'readonly').objectStore(STORE).keyPath==='sura'; }catch(e){ ok=false; }
          if(ok){ res(db); return; }
          db.close(); rej(new Error('store layout differs')); return;
        }
        const v=db.version+1; db.close();                       // the store is missing: add it with the next version
        const r2=indexedDB.open(name,v);
        r2.onupgradeneeded=()=>{ if(!r2.result.objectStoreNames.contains(STORE)) r2.result.createObjectStore(STORE,{keyPath:'sura'}); };
        r2.onsuccess=()=>res(r2.result);
        r2.onerror=()=>rej(r2.error||new Error('upgrade failed'));
        r2.onblocked=()=>rej(new Error('database blocked'));
      };
    });
  }
  async function openDb(){
    if(!window.indexedDB) throw new Error('IndexedDB not available');
    let last=null;
    for(const n of DB_NAMES){
      try{ return await openNamed(n); }catch(e){ last=e; }
    }
    throw last||new Error('open failed');
  }
  function putOne(db,rec){
    return new Promise((res,rej)=>{
      const tx=db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).put({sura:rec.sura,name:rec.name,blob:rec.blob,saved:Date.now()});
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error||new Error('write failed')); tx.onabort=()=>rej(tx.error||new Error('write aborted'));
    });
  }
  const prog=document.getElementById('autoProg'); let hideT=null;
  function say(msg,sticky){ if(!prog) return; prog.textContent=msg; prog.style.display='block'; clearTimeout(hideT); if(!sticky) hideT=setTimeout(()=>{prog.style.display='none';},5000); }
  let queue=Promise.resolve();
  // how many surahs are saved inside the app (written under the delete button)
  async function refreshSavedInfo(){
    const el=document.getElementById('audioSavedInfo'); if(!el) return;
    let suras=[], db=null;
    try{
      db=await openDb();
      suras=await new Promise((res,rej)=>{ const r=db.transaction(STORE,'readonly').objectStore(STORE).getAllKeys(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
    }catch(e){ suras=[]; }
    finally{ if(db) db.close(); }
    suras=suras.map(Number).filter(n=>n>=1).sort((a,b)=>a-b);
    if(!suras.length){ el.textContent=t('audioSavedNone'); return; }
    const shown=suras.slice(0,24).join(', ')+(suras.length>24?', …':'');
    el.textContent=tf('audioSavedCount',{n:suras.length})+' ('+shown+')';
  }
  window.__refreshAudioSaved=refreshSavedInfo;
  let rsT=null;                                           // refresh after any tap (only while the menu line is visible), so it follows the language too
  document.addEventListener('click',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ const el=document.getElementById('audioSavedInfo'); if(el && el.offsetParent!==null) refreshSavedInfo(); },350); }, true);
  // audio files are NOT kept inside the app any more (they made the app very large); only the position is remembered
  window.__persistAudioList=function(list){ return Promise.resolve(); };
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  // restore the saved audio when the app starts
  (async function restore(){
    let db=null;
    try{
      db=await openDb();
      // one-time cleanup: free the space used by audio saved by older versions
      await new Promise(res=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete=res; tx.onerror=res; tx.onabort=res; });
    }catch(e){ /* storage not available: the app works as before */ }
    finally{ if(db) db.close(); }
    refreshSavedInfo();
  })();

  // Delete the audio saved inside the app: press and HOLD the button (a short tap only shows a hint)
  const cb=document.getElementById('clearAudioBtn');
  if(cb){
    const css=document.createElement('style');
    css.textContent=`#clearAudioBtn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}`;
    document.head.appendChild(css);
    let asking=false;
    // take the imported audio out of the player and out of memory, so it is visibly gone
    function unloadAudio(){
      try{ player.pause(); }catch(_){}
      const urls=new Set(); audioBySura.forEach(v=>{ if(v && v.url) urls.add(v.url); });
      if(player.currentSrc) urls.add(player.currentSrc);
      audioBySura.clear();
      try{ player.removeAttribute('src'); player.load(); }catch(_){}
      urls.forEach(u=>{ try{ if(String(u).indexOf('blob:')===0) URL.revokeObjectURL(u); }catch(_){} });
      try{
        player.style.display='none';
        speedrow.style.display='none'; seekRow.style.display='none';
        fname.textContent=''; markBtn.disabled=true; window.__audioName=null;
      }catch(_){}
    }
    async function wipe(){
      unloadAudio();
      try{ if(navigator.vibrate) navigator.vibrate(60); }catch(_){}
      try{
        const db=await openDb();
        await new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); });
        db.close();
      }catch(err){ try{ console.warn('audio delete failed', err); }catch(_){} }
      refreshSavedInfo();
    }
    async function askAndWipe(){
      if(asking) return; asking=true;
      try{
        const yes=await appConfirm(t('audioClearAsk'), t('dlgYes'), t('dlgCancel'));
        if(yes) await wipe();
      } finally { asking=false; }
    }
    // the question appears the moment the button is touched (Yes / Cancel decides)
    // the question opens only on a real tap (finger lifted on the button); scrolling the menu with a finger on it no longer triggers it
    cb.addEventListener('pointerdown',e=>{ e.stopPropagation(); });
    cb.addEventListener('contextmenu',e=>e.preventDefault());
    cb.addEventListener('click',e=>{
      e.stopPropagation();
      cb.classList.add('pressFx');
      setTimeout(()=>cb.classList.remove('pressFx'), 220);
      setTimeout(askAndWipe, 140);
    });
  }

  // all texts follow the chosen language (also the buttons added later)
  try{ applyLanguage(currentLang); }catch(e){}
})();


// ================= Resume where you stopped (audio itself is not stored) =================
(function(){
  const KEY='app_resume_v1';
  let st={sura:0,pos:{}};
  try{ const o=JSON.parse(localStorage.getItem(KEY)||'{}'); if(o&&typeof o==='object'){ st.sura=parseInt(o.sura)||0; st.pos=(o.pos&&typeof o.pos==='object')?o.pos:{}; } }catch(_){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(_){} }
  function curSura(){ return parseInt(suraSelect.value)||0; }
  let audioSura=0;                       // the surah the audio currently in the player belongs to
  function remember(){
    const s=audioSura; if(!s || !player.getAttribute('src')) return;
    const t=player.currentTime, d=player.duration;
    if(!isFinite(t) || player.readyState<1) return;
    if(player.ended || (isFinite(d) && t>=d-2)){ delete st.pos[s]; save(); return; }
    if(t>1){ st.pos[s]=Math.round(t*10)/10; }
    st.sura=curSura()||st.sura;
    save();
  }
  let lastWrite=0;
  player.addEventListener('timeupdate',()=>{ const n=Date.now(); if(n-lastWrite>2000){ lastWrite=n; remember(); } });
  player.addEventListener('pause',remember);
  player.addEventListener('ended',()=>{ if(audioSura){ delete st.pos[audioSura]; save(); } });
  player.addEventListener('loadstart',()=>{ audioSura=0; });
  player.addEventListener('loadedmetadata',()=>{
    const s=curSura(); audioSura=s;
    const p=parseFloat(st.pos[s]);
    if(p>1 && isFinite(player.duration) && p<player.duration-3 && player.currentTime<1){
      try{ player.currentTime=p; }catch(_){}
    }
  });
  suraSelect.addEventListener('change',()=>{ st.sura=curSura(); save(); });
  window.__clearResume=function(n){ delete st.pos[n]; save(); };
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') remember(); });
  window.addEventListener('pagehide',remember);
  // reopen the surah you were on
  window.addEventListener('load',()=>{
    setTimeout(()=>{
      if(st.sura>=1 && st.sura<=114 && curSura()!==st.sura){
        suraSelect.value=String(st.sura);
        suraSelect.dispatchEvent(new Event('change'));
      }
    },500);
  });
})();

  Object.assign(TRANSLATIONS.ku, {

    audioFolderAsk:"بۆ ئەوەی فۆڵدەری «Ayah-marker» لە ناو مەلەفاتی سەرەکی مۆبایلەکەت دروست بکرێت و دەنگەکانی خۆکار بخوێنرێنەوە، دەبێت «ڕێگەدان بە بەڕێوەبردنی هەموو فایلەکان» بۆ ئەم ئەپە چالاک بکەیت.\nدوای ئەوە دەنگی سورەتەکان (وەک 002.mp3) لەو فۆڵدەرەدا دابنێ.",
    audioFolderChoose:"چالاککردن", audioFolderLater:"دواتر",
    audioFolderFound:"{n} دەنگ لە فۆڵدەری Ayah-marker دۆزرایەوە", audioFolderEmpty:"هیچ دەنگێک لە فۆڵدەری Ayah-marker نییە",
    audioFolderFail:"نەتوانرا فۆڵدەرەکە بخوێنرێتەوە", audioFolderNoAccess:"ڕێگەدان چالاک نەکرا — فۆڵدەری Ayah-marker بەکارناهێنرێت", savedFolderOk:"هەڵگیرا ✅\nفۆڵدەری Ayah-marker:", audioFolderCurrent:"فۆڵدەری ئێستا:", audioFolderPick:"هەڵبژاردنی فۆڵدەر", dbPickTitle:"فایلی داتابەیس هەڵبژێرە", dbPickOther:"هەڵبژاردنی فایل لە شوێنێکی تر"});
  Object.assign(TRANSLATIONS.en, {
    audioFolderBtn:"📁 Audio folder (Ayah-marker)",
    audioFolderAsk:"To create the folder \"Ayah-marker\" in your phone's main storage and load its audio automatically, turn on \"Allow management of all files\" for this app.\nThen put the surah audio files (for example 002.mp3) in that folder.",
    audioFolderChoose:"Turn on", audioFolderLater:"Later",
    audioFolderFound:"{n} audio files found in the Ayah-marker folder", audioFolderEmpty:"No audio files in the Ayah-marker folder",
    audioFolderFail:"Could not read the folder", audioFolderNoAccess:"Access was not turned on — the Ayah-marker folder cannot be used", savedFolderOk:"Saved ✅\nAyah-marker folder:", audioFolderCurrent:"Current folder:", audioFolderPick:"Choose folder", dbPickTitle:"Choose a database file", dbPickOther:"Choose a file from another place"});
  Object.assign(TRANSLATIONS.ar, {
    audioFolderBtn:"📁 مجلد الصوتيات (Ayah-marker)",
    audioFolderAsk:"لإنشاء المجلد «Ayah-marker» في التخزين الرئيسي للهاتف وتحميل الصوتيات منه تلقائيًا، فعّل «السماح بإدارة جميع الملفات» لهذا التطبيق.\nثم ضع ملفات السور (مثل 002.mp3) داخل هذا المجلد.",
    audioFolderChoose:"تفعيل", audioFolderLater:"لاحقًا",
    audioFolderFound:"تم العثور على {n} ملف صوتي في المجلد Ayah-marker", audioFolderEmpty:"لا توجد ملفات صوتية في المجلد Ayah-marker",
    audioFolderFail:"تعذّرت قراءة المجلد", audioFolderNoAccess:"لم يتم تفعيل الإذن — لا يمكن استخدام المجلد Ayah-marker", savedFolderOk:"تم الحفظ ✅\nمجلد Ayah-marker:", audioFolderCurrent:"المجلد الحالي:", audioFolderPick:"اختيار مجلد", dbPickTitle:"اختر ملف قاعدة البيانات", dbPickOther:"اختيار ملف من مكان آخر"});

  let pl=null;
  try{ pl=nativePlugin('AudioFolder'); }catch(_){ return; }
  const btn=document.getElementById('audioFolderBtn');
  if(btn) btn.style.display='block';
  // the chosen folder (default: Ayah-marker in the main storage); its name is written on the button
  let curPath=null, curName='Ayah-marker';
  try{ curPath=localStorage.getItem('audio_folder_path')||null; if(curPath) curName=localStorage.getItem('audio_folder_name')||'Ayah-marker'; }catch(_){}
  function setLabel(){
    if(!btn) return;
    const base=t('audioFolderBtn').replace(/\s*\([^)]*\)\s*$/,'');
    const want=base+' (\u2066'+curName+'\u2069)';
    if(btn.textContent!==want) btn.textContent=want;
  }
  if(btn){ try{ new MutationObserver(setLabel).observe(btn,{childList:true,characterData:true,subtree:true}); }catch(_){} }
  try{ applyLanguage(currentLang); }catch(_){}
  setLabel();

  function srcOf(path){
    const C=window.Capacitor, p=encodeURI(path);
    return (C && typeof C.convertFileSrc==='function') ? C.convertFileSrc(p) : 'file://'+p;
  }
  let folderOn=false;          // the folder is readable: then ONLY its audio is used
  let scanning=false;
  // read the folder: file 002.mp3 belongs to surah 2; files that disappeared are forgotten
  async function scan(announce){
    if(scanning) return {granted:folderOn};
    scanning=true;
    try{
      const r=await pl.listAudio(curPath ? {path:curPath} : {});
      if(!r || !r.granted){ folderOn=false; return {granted:false}; }
      folderOn=true;
      const seen=new Set(); let found=0;
      (r.files||[]).forEach(f=>{
        const n=extractSuraNumber(f.name); if(!n) return;
        found++; seen.add(n);
        const old=audioBySura.get(n);
        if(!old || old.name!==f.name || !old.fromFolder) audioBySura.set(n,{url:srcOf(f.path), name:f.name, fromFolder:true});
      });
      [...audioBySura.keys()].forEach(n=>{ const v=audioBySura.get(n); if(v && v.fromFolder && !seen.has(n)) audioBySura.delete(n); });
      if(announce) appAlert((found ? tf('audioFolderFound',{n:found}) : t('audioFolderEmpty')) + '\n\u2066' + (r.path||'') + '\u2069');
      const cur=parseInt(suraSelect.value)||1;
      if(audioBySura.has(cur)){
        const a=audioBySura.get(cur);
        if(!player.getAttribute('src') || (announce && player.getAttribute('src')!==a.url)) loadAudioIntoPlayer(a.url, a.name);
      } else if(player.getAttribute('src') && (!audioBySura.size || announce)){
        unloadPlayer();
      }
      return {granted:true, found:found};
    }catch(e){
      if(announce) appAlert(t('audioFolderFail') + '\n\u2066' + (e && e.message ? e.message : e) + '\u2069');
      return {granted:false, error:true};
    }finally{ scanning=false; }
  }
  function unloadPlayer(){
    try{ player.pause(); }catch(_){}
    try{ player.removeAttribute('src'); player.load(); }catch(_){}
    try{
      player.style.display='none'; speedrow.style.display='none'; seekRow.style.display='none';
      fname.textContent=''; markBtn.disabled=true; window.__audioName=null;
    }catch(_){}
  }
  // a surah that has no file in the folder plays NOTHING (the previous surah's audio is taken out)
  suraSelect.addEventListener('change',()=>{
    setTimeout(()=>{
      if(!folderOn) return;
      const s=parseInt(suraSelect.value)||0;
      if(!audioBySura.has(s) && player.getAttribute('src')) unloadPlayer();
    }, 400);
  });

  async function enable(){
    let r; try{ r=await pl.requestAccess(); }catch(e){ appAlert(t('audioFolderFail') + '\n\u2066' + (e && e.message ? e.message : e) + '\u2069'); return false; }
    if(!r || !r.granted){ appAlert(t('audioFolderNoAccess')); return false; }
    try{ await pl.ensureFolder(); }catch(_){}
    await scan(true);
    return true;
  }
  if(btn) btn.addEventListener('click',async()=>{
    settingsMenu.classList.remove('open');
    let st=null; try{ st=await pl.status(); }catch(e){ appAlert(t('audioFolderFail') + '\n\u2066' + (e && e.message ? e.message : e) + '\u2069'); return; }
    if(!(st && st.granted)){ await enable(); return; }
    const shownPath = curPath || st.path || '';
    const pick = await appChoose(t('audioFolderCurrent') + '\n\u2066' + shownPath + '\u2069', t('audioFolderPick'));
    if(pick){
      let fr=null;
      try{ fr=await pl.pickFolder(); }
      catch(e){ appAlert(t('audioFolderFail') + '\n\u2066' + (e && e.message ? e.message : e) + '\u2069'); return; }
      if(!fr || !fr.path) return;                       // cancelled
      curPath=fr.path; curName=fr.name || 'folder';
      try{ localStorage.setItem('audio_folder_path',curPath); localStorage.setItem('audio_folder_name',curName); }catch(_){}
      setLabel();
    }else if(!curPath){ try{ await pl.ensureFolder(); }catch(_){} }
    await scan(true);
  });

  // launch: read the folder; the first time, ask once to turn the permission on and create the folder
  // ---- load-db button: a list with only the .db files of Ayah-marker ----
  function fmtSize(n){ return n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
  function chooseDbDialog(files){
    return new Promise(resolve=>{
      const old=document.getElementById('dbPickOv'); if(old) old.remove();
      const dark=document.body.classList.contains('dark');
      const fg=dark?'#fff':'#000';
      const ov=document.createElement('div'); ov.id='dbPickOv'; ov.setAttribute('dir', document.documentElement.dir||'rtl');
      ov.style.cssText='position:fixed;inset:0;z-index:2147483300;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;';
      const box=document.createElement('div');
      box.style.cssText='max-width:420px;width:100%;max-height:80vh;display:flex;flex-direction:column;border-radius:16px;padding:18px 16px 14px;box-sizing:border-box;box-shadow:0 10px 40px rgba(0,0,0,.45);background:'+(dark?'#202d3d':'#ece4d1')+';color:'+fg+';';
      const h=document.createElement('p'); h.textContent=t('dbPickTitle'); h.style.cssText='font-size:17px;font-weight:700;margin:0 0 12px;color:'+fg+';';
      const list=document.createElement('div'); list.style.cssText='overflow-y:auto;flex:1 1 auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;';
      const btnCss='font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid '+(dark?'#b8d8c5':'#0f3d3a')+';background:transparent;color:'+fg+';cursor:pointer;';
      const done=v=>{ ov.remove(); resolve(v); };
      files.forEach(f=>{
        const b=document.createElement('button'); b.type='button'; b.style.cssText=btnCss+'text-align:start;';
        const nm=document.createElement('div'); nm.textContent=f.name; nm.style.cssText='direction:ltr;text-align:left;font-weight:700;word-break:break-all;';
        const meta=document.createElement('div'); meta.textContent=fmtSize(f.size||0); meta.style.cssText='direction:ltr;text-align:left;font-size:13px;opacity:.75;margin-top:2px;';
        b.append(nm,meta); b.addEventListener('click',e=>{ e.stopPropagation(); done(f); }); list.appendChild(b);
      });
      const other=document.createElement('button'); other.type='button'; other.textContent=t('dbPickOther'); other.style.cssText=btnCss+'margin-bottom:8px;';
      other.addEventListener('click',e=>{ e.stopPropagation(); done('other'); });
      const cancel=document.createElement('button'); cancel.type='button'; cancel.textContent=t('dlgCancel'); cancel.style.cssText=btnCss;
      cancel.addEventListener('click',e=>{ e.stopPropagation(); done(null); });
      box.append(h,list,other,cancel); ov.appendChild(box);
      ov.addEventListener('click',e=>e.stopPropagation());
      document.body.appendChild(ov);
    });
  }
  window.__pickDbFromFolder = async function(){
    let st=null; try{ st=await pl.status(); }catch(_){ return false; }
    if(!st || !st.supported || !st.granted) return false;
    let r=null; try{ r=await pl.listDb(); }catch(_){ return false; }
    if(!r || !r.files || !r.files.length) return false;          // no .db in Ayah-marker: the system picker opens
    settingsMenu.classList.remove('open');
    const files=r.files.slice().sort((a,b)=>(String(b.name).toLowerCase()===AUTO_DB_NAME)-(String(a.name).toLowerCase()===AUTO_DB_NAME));   // output.db first
    const chosen=await chooseDbDialog(files);                    // the list box always appears (output.db first), plus the 'other' button
    if(chosen==='other') return false;
    if(!chosen) return true;                                     // cancelled
    try{
      const resp=await fetch(srcOf(chosen.path));
      const blob=await resp.blob();
      loadMasterFile(new File([blob], chosen.name, {type:'application/x-sqlite3'}));
    }catch(e){ appAlert(t('errReadFile')); }
    return true;
  };
  // the language screen comes first: wait until a language is chosen, so the permission box is in that language
  function waitForLanguage(){
    return new Promise(resolve=>{
      const check=()=>{
        const ov=document.getElementById('langPickOverlay');
        if(!ov || ov.classList.contains('hide')) resolve(); else setTimeout(check,150);
      };
      check();
    });
  }
  async function init(){
    await waitForLanguage();
    await new Promise(r=>setTimeout(r,300));      // let the language screen close first
    let st=null; try{ st=await pl.status(); }catch(_){ return; }
    if(!st || !st.supported) return;
    if(st.granted){ try{ await pl.ensureFolder(); }catch(_){} await scan(false); return; }
    showGate();                                       // no permission: the app stays closed behind this screen
  }
  // Full-screen gate: the app cannot be used until "All files access" is turned on
  function showGate(){
    if(document.getElementById('permGateOv')) return;
    const dark=document.body.classList.contains('dark');
    const ov=document.createElement('div'); ov.id='permGateOv'; ov.setAttribute('dir', document.documentElement.dir||'rtl');
    ov.style.cssText='position:fixed;inset:0;z-index:2147483600;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:'+(dark?'#171f2b':'#f6f1e4')+';';
    const box=document.createElement('div'); box.style.cssText='max-width:420px;width:100%;';
    const m=document.createElement('p'); m.textContent=t('audioFolderAsk');
    m.style.cssText='font-size:17px;line-height:1.7;margin:0 0 20px;white-space:pre-wrap;text-align:start;color:'+(dark?'#fff':'#000')+';';
    const b=document.createElement('button'); b.type='button'; b.textContent=t('audioFolderChoose');
    b.style.cssText='width:100%;font:inherit;font-size:17px;font-weight:700;padding:13px 12px;border-radius:12px;border:none;cursor:pointer;background:'+(dark?'#d9b85f':'#0f3d3a')+';color:'+(dark?'#17120a':'#fff')+';';
    b.addEventListener('click',async()=>{
      b.disabled=true;
      try{ await pl.requestAccess(); }catch(_){}
      b.disabled=false;
      await checkGate();
    });
    box.append(m,b); ov.appendChild(box); document.body.appendChild(ov);
  }
  async function checkGate(){
    const ov=document.getElementById('permGateOv'); if(!ov) return;
    let st=null; try{ st=await pl.status(); }catch(_){ return; }
    if(st && st.granted){
      ov.remove();
      try{ await pl.ensureFolder(); }catch(_){}
      await scan(false);
    }
  }
  window.addEventListener('load',()=>{ setTimeout(init, 1200); });
  // coming back to the app (also after the permission screen): read the folder again
  let lastScan=0;
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){ checkGate(); }
    if(document.visibilityState==='visible' && Date.now()-lastScan>3000){ lastScan=Date.now(); scan(false); }
  });
})();

</script>

body.dark .footer-actions button,body.dark .fontBtn,body.dark .backbtn,body.dark #audioPickBtn,body.dark #startAyah,

/* menu open: hide the speed, time, play button and surah/ayah pill above it (the ☰ button stays) */
body:has(#settingsMenu.open) #miniSpeed,body:has(#settingsMenu.open) #miniSpeedList,body:has(#settingsMenu.open) #miniTime,
body:has(#settingsMenu.open) #surahAyahPill,body:has(#settingsMenu.open) #miniPlayBtn,body:has(#settingsMenu.open) .topbar .minifield,body:has(#settingsMenu.open) .minifield:has(#suraSelect),body:has(#settingsMenu.open) .minifield:has(#startAyah),body:has(#settingsMenu.open) #suraSelect,body:has(#settingsMenu.open) #startAyah{display:none !important;}

body:not(.dark) #marksList .mark-row:not(.last-reached){border-bottom:1px solid rgba(0,0,0,.18) !important;}

html body .mark-row .rownum{font-size:14px !important;font-weight:700 !important;min-width:22px !important;}
